[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vid2skill"
version = "1.0.0"
description = "Universal agent skill synthesizer from video, audio, text, and user feedback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Gwen & Antigravity" }
]
keywords = ["agent-skill", "yt-dlp", "ai-agents", "claude-code", "antigravity", "skill-creator"]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
vid2skill = "vid2skill.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vid2skill*"]
